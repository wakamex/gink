[package]
name = "signal-store"
version = "0.0.0"
publish = false
edition = "2024"
license = "AGPL-3.0-only"

[dependencies]
signal-client = { path = "../signal-client" }

async-trait = "0.1.83"
bytes = "1.9.0"
chrono = "0.4.38"
prost = "0.14.4"
serde_json = "1.0.135"
sqlx = { version = "0.9.0", features = [
    "json",
    "sqlite",
    "uuid",
    "runtime-tokio",
] }
thiserror = "2.0.0"
tracing = "0.1.41"
uuid = "1.12.0"

# SQLCipher with its cryptography supplied by Rust crates, so no OpenSSL is needed on any system.
libsqlite3-sys = { version = "0.36.0", features = ["bundled-sqlcipher-custom-crypto"] }


[dev-dependencies]
rand = "0.9"
tokio = { version = "1.48", default-features = false, features = ["macros", "rt"] }
